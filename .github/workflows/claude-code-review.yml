# Automatic Claude review of every pull request from a branch in this repository, posted as
# inline comments (or one summary comment when it finds nothing). Complements CodeRabbit's
# "chill" pass. Fork PRs get no secrets on public repos, and the action rejects bot actors
# (Dependabot), so both are skipped up front instead of failing red.
# See https://code.claude.com/docs/en/github-actions#run-a-skill
name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions: { contents: read }
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true          # a new push supersedes the review in flight
jobs:
  review:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 1 }
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # a tracking comment that ends "Completed" — a visible outcome even when the review is clean
          track_progress: true
          # inline findings go through the MCP server (started only when named here); the
          # "no issues found" summary is posted by the skill with `gh pr comment`, which the
          # action only permits when listed too (skill frontmatter alone is not enough here)
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"'
