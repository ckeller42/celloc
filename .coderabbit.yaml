# CodeRabbit AI review config — https://docs.coderabbit.ai
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: "**"
      instructions: >-
        This is a public, generic project. Flag any content that ties the
        repository to the author's own deployment instead of a generic user,
        as a "setup exposure" finding: private/LAN addresses (192.168.x.x,
        10.x.x.x, 172.16-31.x.x) or specific subnets; tailnet addresses
        (100.x.x.x) and MagicDNS/tailnet names (*.ts.net); personal
        hostnames or machine names; usernames, home directories, or
        absolute personal paths (/Users/<name>, /home/<name>); email
        addresses; MAC addresses, serial numbers, IMEI/ICCID; WiFi SSIDs;
        real coordinates, addresses, or place names of the author's vehicle
        or home; secrets or credential fragments (API keys, tokens, MQTT/
        InfluxDB/Grafana credentials, usign keys) even if partial or in
        examples; cloud org/bucket/instance identifiers. Prefer placeholders
        (<router>, 192.0.2.0/24, example.invalid, <GOOGLE_KEY>) in docs
        and tests; those documentation placeholders (RFC 5737 192.0.2.0/24,
        198.51.100.0/24, 203.0.113.0/24, RFC 2606 example.* / .invalid, and
        <ANGLE_BRACKET> or AIza... ellipsis stand-ins) are NOT findings. Explicitly ALLOWED and not a finding: naming the
        hardware and software in use (e.g. GL-iNet GL-E5800, Quectel
        modem models, Raspberry Pi models, ESP32/M5Stack boards, OpenWrt
        versions), the project's own public URLs (github.com/ckeller42/
        celloc, ckeller42.github.io), generic system paths
        (/etc/config/geolocd), and the author's public GitHub handle.
    - path: "**/*.go"
      instructions: >-
        Enforce the pure-vs-I/O split: parsing/marshaling packages must stay
        free of network, filesystem, env and time-of-day access (inject them).
        Flag any fabricated GPS data — a cell fix must be TPV mode 2 with
        eph=epx=epy from the OpenCelliD range and no alt/speed/track. Flag
        secrets (OpenCelliD/InfluxDB tokens) in argv, logs, or committed files.
    - path: "**/*_test.go"
      instructions: >-
        Prefer table-driven tests. Require edge cases: garbage/partial AT input,
        error/transient/unknown-cell paths, and CRLF handling. Do not weaken
        assertions just to raise coverage.
    - path: "packaging/openwrt/**"
      instructions: >-
        Verify procd usage, conffiles for /etc/config/geolocd, and that the
        firmware-upgrade (sysupgrade wipes /usr/bin) caveat is handled/documented.
  tools:
    golangci-lint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
chat:
  auto_reply: true
