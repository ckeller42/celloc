# Single source of truth for lint/format/secret-scan tool versions: CI's
# `pre-commit` job runs exactly this file (`pre-commit run --all-files`), so a
# version bump here is a bump everywhere.
#
# Install (both stages — go test runs on pre-push):
#   pipx install pre-commit && pre-commit install
# default_install_hook_types makes a plain `pre-commit install` set up both.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Built from source (language: golang); its go.mod needs Go >= 1.24.11, so
  # GOTOOLCHAIN must allow a toolchain download (Go's default `auto` does; CI
  # re-enables it after setup-go sets `local`).
  # The stock hook scans only *staged* changes (`gitleaks git --staged`), so it
  # finds nothing under `pre-commit run --all-files`. The second entry,
  # manual-stage only, scans the whole working tree with the same pinned
  # gitleaks; CI runs it with `--hook-stage manual`.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-dir
        name: gitleaks (working tree)
        entry: gitleaks dir --redact --verbose .
        pass_filenames: false
        stages: [manual]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2   # config: .markdownlint-cli2.jsonc

  # Built from source at this tag (language: golang), so local and CI lint with
  # the identical version. Bump only if `golangci-lint run` stays clean.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.1.6
    hooks:
      - id: golangci-lint-config-verify
      - id: golangci-lint-full   # golangci-lint run --fix (all packages)
      - id: golangci-lint-fmt    # golangci-lint fmt (gofumpt, per .golangci.yml)

  - repo: local
    hooks:
      - id: go-build-entrypoints
        name: go build ./cmd/... (catch missing/broken mains)
        entry: go build -o /dev/null ./cmd/geolocd ./cmd/geoinflux
        language: system
        types: [go]
        pass_filenames: false
      - id: go-test
        name: go test ./...
        entry: go test ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]
